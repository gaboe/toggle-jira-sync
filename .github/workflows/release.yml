name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-crate:
    name: Publish CLI crate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "toggl-jira-sync") | .version')
          tag_version=${GITHUB_REF_NAME#v}
          test "$crate_version" = "$tag_version"

      - name: Authenticate with crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish

  build-desktop:
    name: Build desktop app (${{ matrix.platform }})
    needs: publish-crate
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tauri/src-tauri -> tauri/src-tauri/target

      - name: Install frontend dependencies
        working-directory: tauri
        run: bun install --frozen-lockfile

      - name: Extract release version
        id: release-version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          tagName: ${{ github.ref_name }}
          releaseName: toggl-jira-sync ${{ github.ref_name }}
          releaseBody: |
            Unsigned desktop builds are attached below.

            CLI crate for this version: https://crates.io/crates/toggl-jira-sync/${{ steps.release-version.outputs.version }}

            Install or update the CLI with Cargo:

            ```sh
            cargo install toggl-jira-sync --force
            ```

            Desktop download guide:
            - macOS Apple Silicon: `toggl-jira-sync_*_aarch64.dmg`
            - macOS Intel: `toggl-jira-sync_*_x64.dmg`
            - Windows installer: `toggl-jira-sync_*_x64-setup.exe` or `toggl-jira-sync_*_x64_en-US.msi`
            - Linux AppImage: `toggl-jira-sync_*_amd64.AppImage`
            - Linux Debian/Ubuntu: `toggl-jira-sync_*_amd64.deb`
            - Linux Fedora/RHEL: `toggl-jira-sync-*-1.x86_64.rpm`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
