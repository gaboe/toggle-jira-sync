[toggl]
workspace_id = 123456
api_token_env = "TOGGL_API_TOKEN"

[runtime]
sqlite_path = "toggl-jira-sync.sqlite"
initial_backfill_from_month = "05.2026"
initial_backfill_days = 90
recovery_from_month = "05.2026"
recovery_scan_days = 180

[rate_limits]
toggl_max_rps = 1.0
jira_global_write_delay_ms = 150
jira_same_issue_write_delay_ms = 2000
jira_max_rate_limit_retries = 8
jira_max_parallel_groups = 4

[jira]

[[jira.sites]]
key = "sabservis"
base_url = "https://sabservis.atlassian.net"
email_env = "SABSERVIS_JIRA_EMAIL"
api_token_env = "SABSERVIS_JIRA_API_TOKEN"
enabled = true

[[jira.sites]]
key = "blogic"
base_url = "https://blogic.atlassian.net"
email_env = "BLOGIC_JIRA_EMAIL"
api_token_env = "BLOGIC_JIRA_API_TOKEN"
enabled = true
