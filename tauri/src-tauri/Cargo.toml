[package]
name = "toggl-jira-sync-tauri"
version = "0.1.27"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.5", features = [] }
toggl-jira-sync = { path = "../.." }
tokio = { version = "1.44.2", features = ["rt-multi-thread"] }
